<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anlatıcı Notu · Yapay Zekâ Atölyesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --kagit: #fbf7f0; --kagit-koyu: #f2ead9; --murekkep: #1e2a38; --murekkep-acik: #4a5868; --turkuaz: #0e7c7b; --turkuaz-acik: #d5ecea; --altin: #e0a93b; --cizgi: #e4dccb; --kart: #fff; }
    @media (prefers-color-scheme: dark) { :root { --kagit: #141a21; --kagit-koyu: #1c242d; --murekkep: #ece6da; --murekkep-acik: #a9b3be; --turkuaz: #4fbcb9; --turkuaz-acik: #17393a; --altin: #e9bb5a; --cizgi: #2a333d; --kart: #1a2129; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--kagit); color: var(--murekkep); font: 17px/1.65 'Inter', system-ui, sans-serif; }
    .kap { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; margin-bottom: 24px; }
    a { color: var(--turkuaz); }
    h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; line-height: 1.2; }
    h1 { font-size: clamp(30px, 5vw, 42px); margin: .2em 0 .5em; }
    h2 { font-size: 26px; margin-top: 1.8em; padding-top: .6em; border-top: 1px solid var(--cizgi); }
    h3 { font-size: 20px; margin-top: 1.4em; }
    blockquote { margin: 1em 0; padding: .6em 1em; background: var(--kart); border-left: 5px solid var(--altin); border-radius: 0 12px 12px 0; }
    code { background: var(--kagit-koyu); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
    pre { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 12px; padding: 14px; overflow-x: auto; white-space: pre-wrap; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
    th, td { border-bottom: 1px solid var(--cizgi); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--kagit-koyu); }
    img { max-width: 100%; }
    .uyari { color: #c8553d; }
    @media print { nav { display: none; } body { background: #fff; color: #000; } }
  </style>
</head>
<body>
  <div class="kap">
    <nav><a href="./">← Tüm konular</a><a id="sunum-baglanti" href="#">Bu konunun sunumu →</a><a href="#" onclick="window.print();return false;">Yazdır</a></nav>
    <article id="icerik"><p>Not yükleniyor…</p></article>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id') || '';
    const gecerli = /^h[1-4]-\d{2}$/.test(id);
    const kutu = document.getElementById('icerik');
    if (!gecerli) {
      kutu.innerHTML = '<p class="uyari">Geçersiz konu kimliği.</p>';
    } else {
      document.getElementById('sunum-baglanti').href = 'sunumlar/' + id + '.html';
      fetch('notlar/' + id + '.md', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(md => {
          kutu.innerHTML = DOMPurify.sanitize(marked.parse(md));
          const h1 = kutu.querySelector('h1');
          if (h1) document.title = h1.textContent + ' · Anlatıcı Notu';
          kutu.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
        })
        .catch(() => { kutu.innerHTML = '<p class="uyari">Bu konunun notu henüz hazır değil.</p>'; });
    }
  </script>
</body>
</html>
